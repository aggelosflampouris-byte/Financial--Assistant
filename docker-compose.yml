version: "3.9"

# =============================================================================
# Enterprise Financial Assistant — Docker Compose (Single-Machine)
# Run: docker compose up -d
# =============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

x-common-env: &common-env
  env_file: .env

networks:
  fa_net:
    driver: bridge

volumes:
  timescaledb_data:
  redis_data:
  qdrant_data:
  kafka_data:
  zookeeper_data:
  vllm_models:

services:

  # ---------------------------------------------------------------------------
  # TimescaleDB (PostgreSQL + time-series extension)
  # ---------------------------------------------------------------------------
  timescaledb:
    image: timescale/timescaledb:2.16.1-pg16
    container_name: fa_timescaledb
    restart: unless-stopped
    networks: [fa_net]
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./infra/timescaledb/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis (cache + pub-sub for market ticks)
  # ---------------------------------------------------------------------------
  redis:
    image: redis/redis-stack:7.4.0-v3
    container_name: fa_redis
    restart: unless-stopped
    networks: [fa_net]
    logging: *default-logging
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
      - "8001:8001"   # RedisInsight UI
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Qdrant (vector database for RAG embeddings)
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: fa_qdrant
    restart: unless-stopped
    networks: [fa_net]
    logging: *default-logging
    volumes:
      - qdrant_data:/qdrant/storage
      - ./infra/qdrant/config.yaml:/qdrant/config/production.yaml:ro
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/readyz || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ---------------------------------------------------------------------------
  # Zookeeper (required by Kafka)
  # ---------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: fa_zookeeper
    restart: unless-stopped
    networks: [fa_net]
    logging: *default-logging
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Apache Kafka (market tick streaming)
  # ---------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: fa_kafka
    restart: unless-stopped
    networks: [fa_net]
    logging: *default-logging
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_LOG_SEGMENT_BYTES: 1073741824   # 1 GB
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "29092:29092"   # External access from host
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ---------------------------------------------------------------------------
  # vLLM — Qwen-2.5-72B-Instruct AWQ (OpenAI-compatible API)
  # Requires NVIDIA GPU with ≥ 80GB VRAM (2x A100 or 4x A6000)
  # ---------------------------------------------------------------------------
  vllm:
    image: vllm/vllm-openai:v0.6.6
    container_name: fa_vllm
    restart: unless-stopped
    networks: [fa_net]
    logging: *default-logging
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - vllm_models:/root/.cache/huggingface
    command: >
      --model Qwen/Qwen2.5-72B-Instruct-AWQ
      --quantization awq
      --dtype auto
      --max-model-len 32768
      --gpu-memory-utilization 0.95
      --tensor-parallel-size 2
      --api-key ${VLLM_API_KEY}
      --host 0.0.0.0
      --port 8000
    ports:
      - "8000:8000"
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 10
      start_period: 300s   # Model loading can take 5+ minutes

  # ---------------------------------------------------------------------------
  # FastAPI Gateway (API + WebSocket server)
  # ---------------------------------------------------------------------------
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: fa_gateway
    restart: unless-stopped
    networks: [fa_net]
    logging: *default-logging
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app/backend:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Market Data Streaming Service (yfinance → Kafka → Redis)
  # ---------------------------------------------------------------------------
  streamer:
    build:
      context: .
      dockerfile: Dockerfile.streamer
    container_name: fa_streamer
    restart: unless-stopped
    networks: [fa_net]
    logging: *default-logging
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env

  # ---------------------------------------------------------------------------
  # RAG Ingestion Worker (SEC EDGAR → Qdrant)
  # ---------------------------------------------------------------------------
  rag_worker:
    build:
      context: .
      dockerfile: Dockerfile.rag
    container_name: fa_rag_worker
    restart: on-failure
    networks: [fa_net]
    logging: *default-logging
    depends_on:
      qdrant:
        condition: service_healthy
    env_file: .env
    environment:
      INGEST_MODE: ${RAG_INGEST_MODE:-pre-load}
      INGEST_TICKERS: ${RAG_DEFAULT_TICKERS:-AAPL,MSFT,GOOGL,AMZN,NVDA}

  # ---------------------------------------------------------------------------
  # Envoy Proxy (TLS termination, rate limiting, observability)
  # ---------------------------------------------------------------------------
  envoy:
    image: envoyproxy/envoy:v1.33-latest
    container_name: fa_envoy
    restart: unless-stopped
    networks: [fa_net]
    logging: *default-logging
    depends_on:
      gateway:
        condition: service_healthy
    volumes:
      - ./infra/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "80:8080"      # Public HTTP
      - "443:8443"     # Public HTTPS (configure TLS certs in envoy.yaml)
      - "9901:9901"    # Envoy admin

  # ---------------------------------------------------------------------------
  # Next.js Frontend (production build, served via Envoy)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fa_frontend
    restart: unless-stopped
    networks: [fa_net]
    logging: *default-logging
    environment:
      NEXT_PUBLIC_API_URL: http://gateway:8080
      NEXT_PUBLIC_WS_URL: ws://gateway:8080
      NEXT_PUBLIC_AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      NEXT_PUBLIC_AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID}
      NEXT_PUBLIC_AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
    ports:
      - "3000:3000"
